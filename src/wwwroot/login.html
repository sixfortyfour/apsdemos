<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
    <link rel="stylesheet" href="/login.css">
    <title>Autodesk Platform Services: Demos - Login</title>
</head>

<body>
    <main>
        <form id="login-form">
            <img class="logo" src="https://cdn.autodesk.io/logo/black/stacked.png" alt="Autodesk Platform Services">
            <h1>Demos</h1>
            <label for="passphrase">Passphrase</label>
            <input type="password" id="passphrase" name="passphrase" autocomplete="current-password" required autofocus>
            <button type="submit">Log In</button>
            <p id="error" class="error"></p>
        </form>
    </main>
    <footer>&copy; sixfortyfour 2026</footer>
    <script src="/login.js"></script>
</body>

</html>
